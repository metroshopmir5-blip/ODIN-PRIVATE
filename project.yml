name: ODIN

options:
  bundleIdPrefix: com.odin.private
  deploymentTarget:
    iOS: "16.0"

targets:
  ODIN:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - .github
          - ODIN.xcodeproj
          - README.md
          - project.yml
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.odin.private
        PRODUCT_NAME: ODIN
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
